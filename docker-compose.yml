services:
  db:
    image: postgres:16
    container_name: talaint-postgres
    environment:
      POSTGRES_USER: talaint
      POSTGRES_PASSWORD: talaint
      POSTGRES_DB: talaint
    ports:
      - "5432:5432"
    volumes:
      - talaint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaint -d talaint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talaint_pgdata:
