intent: rag
sources:
  - name: my-http-source
    type: http_json
    url: http://localhost:8080/data
    headers:
      Authorization: { ref: api_token }
    schedule:
      interval: 1m
    initial_sync: full
  - name: my-second-http-source
    type: http_json
    url: http://localhost:8080/other-data
    schedule:
      interval: 5m
    initial_sync: latest
