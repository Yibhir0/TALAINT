name: talaint

services:
  config-db:
    image: postgres:16
    environment:
      POSTGRES_DB: talaint
      POSTGRES_USER: talaint
      POSTGRES_PASSWORD: talaint
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init/config-db:/docker-entrypoint-initdb.d:ro
      - config-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaint -d talaint"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - talaint-net

  source-pg:
    image: postgres:16
    environment:
      POSTGRES_DB: source
      POSTGRES_USER: talaint
      POSTGRES_PASSWORD: talaint
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init/source-pg:/docker-entrypoint-initdb.d:ro
      - source-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaint -d source"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - talaint-net

  source-mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: source
      MYSQL_USER: talaint
      MYSQL_PASSWORD: talaint
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/init/source-mysql:/docker-entrypoint-initdb.d:ro
      - source-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - talaint-net

  http-source:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - talaint-net

  dest-pg:
    image: postgres:16
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: talaint
      POSTGRES_PASSWORD: talaint
    ports:
      - "5434:5432"
    volumes:
      - ./docker/init/dest-pg:/docker-entrypoint-initdb.d:ro
      - dest-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaint -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - talaint-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: talaint_dw
      CLICKHOUSE_USER: talaint
      CLICKHOUSE_PASSWORD: talaint
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./docker/init/clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "talaint", "--password", "talaint", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - talaint-net

networks:
  talaint-net:
    name: talaint-net
    driver: bridge

volumes:
  config-db-data:
  source-pg-data:
  source-mysql-data:
  dest-pg-data:
  clickhouse-data:
